name: Verify install

# Per-unit install smoke tests (ADR-0008). Each release unit — core (crate),
# sdk-ts (npm), sdk-py (PyPI), the framework adapters vercel-ai-sdk + mastra (npm),
# the rankers plugin (rankers-ts on npm, rankers-py on PyPI), and the three telemetry units (telemetry-core on crates.io, telemetry-ts on
# npm, telemetry-py on PyPI) — is verified from its public registry with no repo
# checkout and no local toolchain state, so a broken publish surfaces here.
#
# workflow_dispatch: pick a `unit` and (optionally) a `version` to verify just
# that one. The daily cron runs `unit: all` at each unit's `latest`.

on:
  workflow_dispatch:
    inputs:
      unit:
        description: Release unit to verify
        type: choice
        default: all
        options: [all, core, sdk-ts, sdk-py, telemetry-core, telemetry-ts, telemetry-py, vercel-ai-sdk, mastra, rankers-ts, rankers-py]
      version:
        description: Version to verify (e.g. 0.2.0-rc.2 or 0.2.0). Only applied when a single unit is selected; ignored for `all`.
        required: false
      tag:
        description: npm dist-tag to fall back to when no version is given (rc or latest)
        required: false
        default: rc
  schedule:
    # Daily at 09:00 UTC against whatever each unit has on `latest`.
    - cron: '0 9 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.unit || 'cron' }}-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

jobs:
  verify-sdk-ts:
    name: verify sdk-ts (${{ matrix.label }})
    # Runs for `sdk-ts`, `all`, or the cron (schedule has no inputs).
    if: github.event_name == 'schedule' || inputs.unit == 'all' || inputs.unit == 'sdk-ts'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runs-on: macos-14
            node_arch: arm64
          # darwin-x64 runs under Rosetta on Apple Silicon: x64 Node is
          # downloaded by setup-node, all child processes inherit x64,
          # npm installs @ratel-ai/sdk-darwin-x64, the binding loads via
          # Rosetta. Avoids the long macos-13 (Intel) runner queue.
          - label: darwin-x64
            runs-on: macos-14
            node_arch: x64
          - label: linux-x64-gnu
            runs-on: ubuntu-latest
            node_arch: x64
          - label: linux-arm64-gnu
            runs-on: ubuntu-24.04-arm
            node_arch: arm64
          - label: win32-x64-msvc
            runs-on: windows-latest
            node_arch: x64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.node_arch }}
      - name: Resolve version
        id: ver
        shell: bash
        # A pinned version only applies when sdk-ts is the single selected unit;
        # otherwise fall back to the dist-tag (rc/latest), defaulting to latest.
        run: |
          set -e
          if [ "${{ inputs.unit }}" = "sdk-ts" ] && [ -n "${{ inputs.version }}" ]; then
            echo "spec=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=${{ inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke-test SDK native binding load
        shell: bash
        run: |
          set -e
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "@ratel-ai/sdk@${{ steps.ver.outputs.spec }}"
          node -e "const {ToolRegistry} = require('@ratel-ai/sdk'); const r = new ToolRegistry(); r.register({id:'x',name:'x',description:'x',inputSchema:{},outputSchema:{}}); const hits = r.search('x', 5); if (!Array.isArray(hits) || hits.length === 0) { console.error('search failed'); process.exit(1); } console.log('OK', hits);"

  verify-vercel-ai-sdk:
    name: verify vercel-ai-sdk (npm)
    if: github.event_name == 'schedule' || inputs.unit == 'all' || inputs.unit == 'vercel-ai-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve version
        id: ver
        shell: bash
        env:
          REQUESTED_UNIT: ${{ inputs.unit }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TAG: ${{ inputs.tag || 'latest' }}
        # The cron verifies `latest`. A caller can pin a version or select the
        # `rc` tag explicitly.
        run: |
          set -euo pipefail
          case "$REQUESTED_TAG" in
            rc|latest) ;;
            *)
              echo "::error::tag must be rc or latest"
              exit 2
              ;;
          esac
          if [ "$REQUESTED_UNIT" = "vercel-ai-sdk" ] && [ -n "$REQUESTED_VERSION" ]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "::error::version must be X.Y.Z or X.Y.Z-rc.N"
              exit 2
            fi
            adapter_spec="$REQUESTED_VERSION"
          else
            adapter_spec="$REQUESTED_TAG"
          fi
          printf 'adapter_spec=%s\n' "$adapter_spec" >> "$GITHUB_OUTPUT"
      - name: Install + smoke-test the published adapter
        shell: bash
        run: |
          set -e
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null
          # Co-install the current SDK on purpose: this proves the adapter's
          # published peer range still admits the newest SDK, which is the drift ADR-0020 fixed.
          npm install --no-audit --no-fund \
            "@ratel-ai/vercel-ai-sdk@${{ steps.ver.outputs.adapter_spec }}" \
            "@ratel-ai/sdk@latest" \
            "ai@^7.0.0"
          node --input-type=module <<'EOF'
          import { aiSdk } from "@ratel-ai/vercel-ai-sdk";
          import { ratel } from "@ratel-ai/sdk";
          import { jsonSchema, tool } from "ai";

          const r = ratel().adaptTo(aiSdk());
          await r.tools.register({
            ping: tool({
              description: "Return pong",
              inputSchema: jsonSchema({ type: "object", additionalProperties: false }),
              execute: async () => ({ pong: true }),
            }),
          });

          const tools = r.modelTools();
          for (const id of ["search_capabilities", "invoke_tool", "get_skill_content"]) {
            if (typeof tools[id]?.execute !== "function") {
              throw new Error(`missing executable capability: ${id}`);
            }
          }

          const result = await tools.invoke_tool.execute(
            { toolId: "ping", args: {} },
            { toolCallId: "verify-install", messages: [] },
          );
          if (result?.pong !== true) {
            throw new Error(`unexpected invoke_tool result: ${JSON.stringify(result)}`);
          }
          console.log("OK", result);
          EOF

  verify-mastra:
    name: verify mastra (npm)
    if: github.event_name == 'schedule' || inputs.unit == 'all' || inputs.unit == 'mastra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve version
        id: ver
        shell: bash
        env:
          REQUESTED_UNIT: ${{ inputs.unit }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TAG: ${{ inputs.tag || 'latest' }}
        # mastra has a GA on `latest`: the cron verifies `latest`. A caller can
        # pin a version or select the `rc` tag explicitly.
        run: |
          set -euo pipefail
          case "$REQUESTED_TAG" in
            rc|latest) ;;
            *)
              echo "::error::tag must be rc or latest"
              exit 2
              ;;
          esac
          if [ "$REQUESTED_UNIT" = "mastra" ] && [ -n "$REQUESTED_VERSION" ]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "::error::version must be X.Y.Z or X.Y.Z-rc.N"
              exit 2
            fi
            adapter_spec="$REQUESTED_VERSION"
          else
            adapter_spec="$REQUESTED_TAG"
          fi
          printf 'adapter_spec=%s\n' "$adapter_spec" >> "$GITHUB_OUTPUT"
      - name: Install + smoke-test the published adapter
        shell: bash
        # Installs the adapter against @ratel-ai/sdk plus its @mastra/core peer, then
        # drives ratel().adaptTo(mastra()): the exposed capability tools must be real
        # Mastra tools and invoke_tool must run a registered tool end to end.
        run: |
          set -e
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null
          # Co-install the current SDK on purpose: this proves the adapter's
          # published peer range still admits the newest SDK, which is the drift ADR-0020 fixed.
          npm install --no-audit --no-fund \
            "@ratel-ai/mastra@${{ steps.ver.outputs.adapter_spec }}" \
            "@ratel-ai/sdk@latest" \
            "@mastra/core@^1.11.0" \
            "zod@^4.0.0"
          node --input-type=module <<'EOF'
          import { mastra } from "@ratel-ai/mastra";
          import { ratel } from "@ratel-ai/sdk";
          import { createTool } from "@mastra/core/tools";

          const r = ratel().adaptTo(mastra());
          await r.tools.register({
            ping: createTool({
              id: "ping",
              description: "Return pong",
              execute: async () => ({ pong: true }),
            }),
          });

          const tools = r.modelTools();
          for (const id of ["search_capabilities", "invoke_tool", "get_skill_content"]) {
            if (typeof tools[id]?.execute !== "function") {
              throw new Error(`missing executable capability: ${id}`);
            }
          }

          // Mastra tool execute is (input, executionContext); supply the minimal
          // no-op observer the adapter threads through (its "valid minimal context").
          const ctx = {
            observe: {
              async span(_name, fn) {
                return fn();
              },
              log() {},
            },
          };
          const result = await tools.invoke_tool.execute({ toolId: "ping", args: {} }, ctx);
          if (result?.pong !== true) {
            throw new Error(`unexpected invoke_tool result: ${JSON.stringify(result)}`);
          }
          console.log("OK", result);
          EOF

  # The rankers plugin (ADR-0028). No vendor is called: a plugin whose key
  # variable is unset must fail with the SDK's typed RetrieverError, which proves
  # the native binding loads and its errors reach the SDK's class.
  verify-rankers-ts:
    name: verify rankers-ts (npm)
    if: github.event_name == 'schedule' || inputs.unit == 'all' || inputs.unit == 'rankers-ts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -e
          if [ "${{ inputs.unit }}" = "rankers-ts" ] && [ -n "${{ inputs.version }}" ]; then
            echo "spec=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=${{ inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install + smoke-test the published plugin
        shell: bash
        run: |
          set -e
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "@ratel-ai/rankers-plugin@${{ steps.ver.outputs.spec }}"
          # Co-install the newest SDK at or above the plugin's floor, prereleases
          # included: proves the "*" peer admits a newer SDK RC, which a range
          # would not (ADR-0028). @latest can sit below the floor.
          floor=$(node -p "require('@ratel-ai/rankers-plugin/package.json').ratel.sdkFloor")
          sdk=$(npx --yes semver@7.7.2 --include-prerelease --range ">=${floor}" \
            $(npm view @ratel-ai/sdk versions --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).join(" ")') \
            | tail -1) || true
          [ -n "$sdk" ] || { echo "::error::no @ratel-ai/sdk on npm at or above ${floor}"; exit 1; }
          echo "co-installing @ratel-ai/sdk@${sdk} (floor ${floor})"
          npm install --no-audit --no-fund "@ratel-ai/sdk@${sdk}"
          RATEL_EXPERIMENTAL_SILENCE=1 node --input-type=module <<'EOF'
          import { RetrieverError } from "@ratel-ai/sdk";
          import { ratelJevPlugin, ratelOpenAIDecisionPlugin } from "@ratel-ai/rankers-plugin";

          const candidates = [{ id: "a", kind: "tool", text: "a" }];
          for (const plugin of [
            ratelJevPlugin({ apiKeyEnv: "RATEL_VERIFY_UNSET_KEY" }),
            ratelOpenAIDecisionPlugin({ apiKeyEnv: "RATEL_VERIFY_UNSET_KEY" }),
          ]) {
            try {
              await plugin.retrieve("q", candidates, 1);
              throw new Error("expected a Config RetrieverError");
            } catch (error) {
              if (!(error instanceof RetrieverError) || error.code !== "Config") throw error;
            }
          }
          console.log("OK");
          EOF
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/rankers/ts/README.md
          sparse-checkout-cone-mode: false
      # The step above picks the SDK itself. This one runs the README's install
      # line as written, so a doc that lands users below the floor fails here.
      - name: Install as the README documents
        shell: bash
        run: |
          set -e
          cmd=$(grep -m1 -E '^npm install .*@ratel-ai/rankers-plugin' "$GITHUB_WORKSPACE/src/rankers/ts/README.md") \
            || { echo "::error::no npm install line in src/rankers/ts/README.md"; exit 1; }
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null
          echo "running: $cmd"
          $cmd --no-audit --no-fund
          floor=$(node -p "require('@ratel-ai/rankers-plugin/package.json').ratel.sdkFloor")
          sdk=$(node -p "require('@ratel-ai/sdk/package.json').version")
          npx --yes semver@7.7.2 --include-prerelease --range ">=${floor}" "$sdk" >/dev/null \
            || { echo "::error::the README install gives @ratel-ai/sdk@${sdk}, below the plugin's floor ${floor}"; exit 1; }
          RATEL_EXPERIMENTAL_SILENCE=1 node --input-type=module -e 'await import("@ratel-ai/rankers-plugin"); console.log("OK")'

  verify-rankers-py:
    name: verify rankers-py (PyPI)
    if: github.event_name == 'schedule' || inputs.unit == 'all' || inputs.unit == 'rankers-py'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve spec
        id: ver
        shell: bash
        run: |
          set -e
          if [ "${{ inputs.unit }}" = "rankers-py" ] && [ -n "${{ inputs.version }}" ]; then
            echo "spec===${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=" >> "$GITHUB_OUTPUT"
          fi
      - name: Install + smoke-test the wheel
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install "ratel-ai-rankers-plugin${{ steps.ver.outputs.spec }}"
          RATEL_EXPERIMENTAL_SILENCE=1 python - <<'EOF'
          import asyncio

          from ratel_ai import RankCandidate, RetrieverError
          from ratel_ai_rankers_plugin import ratel_jev_plugin, ratel_openai_decision_plugin

          async def main() -> None:
              candidates = [RankCandidate("a", "tool", "a")]
              for plugin in (
                  ratel_jev_plugin(api_key_env="RATEL_VERIFY_UNSET_KEY"),
                  ratel_openai_decision_plugin(api_key_env="RATEL_VERIFY_UNSET_KEY"),
              ):
                  try:
                      await plugin.retrieve("q", candidates, 1)
                  except RetrieverError as error:
                      assert error.code == "Config", error.code
                  else:
                      raise AssertionError("expected a Config RetrieverError")
              print("OK")

          asyncio.run(main())
          EOF

  verify-sdk-py:
    name: verify sdk-py (${{ matrix.label }})
    if: github.event_name == 'schedule' || inputs.unit == 'all' || inputs.unit == 'sdk-py'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runs-on: macos-14
            python_arch: arm64
          # darwin-x64 runs under Rosetta on Apple Silicon (same trick as the npm
          # `verify` job): setup-python fetches an x64 interpreter, so pip installs
          # the x86_64-apple-darwin wheel and loads it via Rosetta. Avoids the long
          # macos-13 (Intel) runner queue while still smoke-testing the x64 wheel.
          - label: darwin-x64
            runs-on: macos-14
            python_arch: x64
          - label: linux-x64-gnu
            runs-on: ubuntu-latest
            python_arch: x64
          - label: linux-arm64-gnu
            runs-on: ubuntu-24.04-arm
            python_arch: arm64
          - label: win32-x64-msvc
            runs-on: windows-latest
            python_arch: x64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
      - name: Resolve spec
        id: ver
        shell: bash
        run: |
          set -e
          if [ "${{ inputs.unit }}" = "sdk-py" ] && [ -n "${{ inputs.version }}" ]; then
            echo "spec===${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=" >> "$GITHUB_OUTPUT"
          fi
      - name: Install + smoke-test the wheel
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install "ratel-ai${{ steps.ver.outputs.spec }}"
          python -c "from ratel_ai import ToolRegistry; r = ToolRegistry(); r.register('x','x','x',{},{}); hits = r.search('x', 5); assert hits and hits[0].tool_id == 'x', hits; print('OK', hits[0].tool_id, hits[0].score)"

  verify-core:
    name: verify core (crate)
    if: github.event_name == 'schedule' || inputs.unit == 'all' || inputs.unit == 'core'
    # The crate is pure Rust source compiled by the consumer (no prebuilt
    # per-OS artifact), so one linux leg that resolves + builds it as a
    # dependency proves downstream installability; no platform matrix needed.
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve spec
        id: ver
        shell: bash
        run: |
          set -e
          if [ "${{ inputs.unit }}" = "core" ] && [ -n "${{ inputs.version }}" ]; then
            echo "spec=@${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=" >> "$GITHUB_OUTPUT"
          fi
      - name: Add + build the published crate
        shell: bash
        run: |
          set -e
          tmp=$(mktemp -d)
          cd "$tmp"
          cargo init --name ratel_verify --bin -q
          cargo add "ratel-ai-core${{ steps.ver.outputs.spec }}"
          # Reference a public type so the published crate must resolve, download,
          # and link for a downstream consumer — the crate analogue of the npm
          # loader / PyPI wheel smoke tests. (The SDK jobs exercise search behavior.)
          cat > src/main.rs <<'EOF'
          fn main() {
              println!("{}", std::any::type_name::<ratel_ai_core::ToolRegistry>());
          }
          EOF
          cargo run -q

  # The telemetry units are independent single-registry units, each with its own
  # verify leg. Each is pure-language (no per-OS artifact), so one linux leg proves
  # downstream installability. Each smoke test reads SEMCONV_VERSION.
  verify-telemetry-ts:
    name: verify telemetry-ts (npm)
    if: github.event_name == 'schedule' || inputs.unit == 'all' || inputs.unit == 'telemetry-ts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -e
          if [ "${{ inputs.unit }}" = "telemetry-ts" ] && [ -n "${{ inputs.version }}" ]; then
            echo "spec=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=${{ inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install + smoke-test the package
        shell: bash
        run: |
          set -e
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "@ratel-ai/telemetry@${{ steps.ver.outputs.spec }}"
          node --input-type=module -e "import { SEMCONV_VERSION } from '@ratel-ai/telemetry'; if (SEMCONV_VERSION !== '1.42.0') { console.error('unexpected SEMCONV_VERSION', SEMCONV_VERSION); process.exit(1); } console.log('OK', SEMCONV_VERSION);"

  verify-telemetry-py:
    name: verify telemetry-py (PyPI)
    if: github.event_name == 'schedule' || inputs.unit == 'all' || inputs.unit == 'telemetry-py'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve spec
        id: ver
        shell: bash
        run: |
          set -e
          if [ "${{ inputs.unit }}" = "telemetry-py" ] && [ -n "${{ inputs.version }}" ]; then
            echo "spec===${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=" >> "$GITHUB_OUTPUT"
          fi
      - name: Install + smoke-test the wheel
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install "ratel-ai-telemetry${{ steps.ver.outputs.spec }}"
          python -c "import ratel_ai_telemetry as t; assert t.SEMCONV_VERSION == '1.42.0', t.SEMCONV_VERSION; print('OK', t.SEMCONV_VERSION)"

  verify-telemetry-core:
    name: verify telemetry-core (crate)
    if: github.event_name == 'schedule' || inputs.unit == 'all' || inputs.unit == 'telemetry-core'
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve spec
        id: ver
        shell: bash
        run: |
          set -e
          if [ "${{ inputs.unit }}" = "telemetry-core" ] && [ -n "${{ inputs.version }}" ]; then
            echo "spec=@${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=" >> "$GITHUB_OUTPUT"
          fi
      - name: Add + build the published crate
        shell: bash
        run: |
          set -e
          tmp=$(mktemp -d)
          cd "$tmp"
          cargo init --name ratel_verify --bin -q
          cargo add "ratel-ai-telemetry${{ steps.ver.outputs.spec }}"
          cat > src/main.rs <<'EOF'
          fn main() {
              println!("{}", ratel_ai_telemetry::SEMCONV_VERSION);
          }
          EOF
          cargo run -q
