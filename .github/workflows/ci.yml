name: ci

# The single pre-merge workflow. Every everyday platform check lives here, in ONE
# workflow, so a single terminal `ci-gate` job can `needs:` all of them — GitHub `needs:`
# cannot cross workflow files, so a true single-context gate requires one file. `ci-gate` (bottom) is the ONLY check of
# this workflow registered as required in the `main` ruleset (scripts/setup-branch-ruleset.sh; the
# other one is `pr-title`, in pr-title.yml); it always
# runs on a ready PR and aggregates the rest.
#
# Draft arming (replaces the old `ready-to-merge` label): `changes` and `ci-gate` carry a
# non-draft guard, and every other job `needs:` `changes` (so a skipped `changes` cascades),
# so a draft PR runs NOTHING and posts NO `ci-gate`. Drafts are unmergeable, so a missing
# check cannot deadlock a merge; marking the PR ready fires `ready_for_review`, which runs
# the pipeline and posts `ci-gate`.
#
# A newer push to main cancels the older run (see `concurrency`). Its `ci-gate` then does
# not run, because a superseded run is not a failure. PR and dispatch runs stay strict: a required
# check that does not run can count as a pass.
#
# Skip-green: `changes` runs scripts/ci-filters.mjs on the pull-request file list so
# untouched areas skip. Platform and design-system name packages/brand and
# packages/design-system by name (never a packages catch-all). Every rule treats
# ci.yml as a full run. On push to main and workflow_dispatch every leg runs regardless
# of the classifier.
#
# The SDKs (Rust core, TS and Python SDKs, adapters, telemetry, rankers, protocol) and
# their CI live in https://github.com/ratel-ai/ratel-sdk.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PRs group by number (supersede in-flight commits); pushes group by ref.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter reads changed files via the API

jobs:
  # Emits a boolean per area. Skipped on draft PRs (so its consumers skip too). On push /
  # workflow_dispatch the legs ignore these outputs and run unconditionally (see each leg's
  # `if:`), so a possibly-empty diff here is harmless.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      design_system: ${{ steps.c.outputs.design_system }}
      platform: ${{ steps.c.outputs.platform }}
      compose: ${{ steps.c.outputs.compose }}
      deploy: ${{ steps.c.outputs.deploy }}
      lockfiles: ${{ steps.c.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: f
        with:
          list-files: json
          filters: |
            changed:
              - '**'
      # The list goes in on stdin: as an env value or an argument, a large change (a folder
      # move) passes the kernel's 128 KB limit for one string and the step dies silently.
      - name: Classify changed paths
        id: c
        run: |
          node scripts/ci-filters.mjs >> "$GITHUB_OUTPUT" <<'CHANGED_FILES_JSON'
          ${{ steps.f.outputs.changed_files }}
          CHANGED_FILES_JSON
      - name: Contract tests
        run: node --test scripts/ci-filters.test.mjs scripts/workflow-contracts.test.mjs

  # Dependency scan: HIGH/CRITICAL advisories with a fix in pnpm-lock.yaml (runtime
  # dependencies) fail the leg; the rest is printed, never gating. Accepted exceptions live
  # in .trivyignore.yaml, each with a reason and an expiry. Trivy runs from a digest-pinned
  # image.
  dependency-scan:
    needs: changes
    if: needs.changes.outputs.lockfiles == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@v4
      - name: Report (not gating)
        run: >
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs
          --scanners vuln --severity HIGH,CRITICAL
          --ignorefile /src/.trivyignore.yaml --exit-code 0 /src
      - name: Gate on fixable HIGH and CRITICAL
        run: >
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --ignorefile /src/.trivyignore.yaml --exit-code 1 /src

  # Brand + design-system packages. A web-only change skips this job.
  design-system:
    needs: changes
    if: needs.changes.outputs.design_system == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --filter @ratel/design-system...
      - name: Typecheck
        run: pnpm --filter @ratel/design-system... --if-present typecheck
      - name: Lint
        run: pnpm --filter @ratel/design-system... --if-present lint
      - name: Test
        run: pnpm --filter @ratel/design-system... --if-present test

  # Open-source platform app: production build, typecheck, lint, db:check, boundary
  # checks. Tests live in platform-test.
  platform-build:
    needs: changes
    if: needs.changes.outputs.platform == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('web/**', 'mcp-apps/**', 'packages/brand/**', 'packages/design-system/**', 'ee/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-
      - name: Install
        run: pnpm install --frozen-lockfile --filter @ratel/platform... --filter @ratel/ee...
      - name: Build
        run: pnpm --filter @ratel/platform... build
      - name: Typecheck
        run: |
          pnpm --filter @ratel/platform typecheck
          pnpm --filter @ratel/mcp-apps typecheck
      - name: Lint
        run: |
          pnpm --filter @ratel/platform lint
          pnpm --filter @ratel/mcp-apps lint
          pnpm --filter @ratel/ee lint
      - name: Check ee boundary and layers
        run: pnpm check:boundary && pnpm check:layers
      - name: Check platform migrations match the schema
        run: pnpm --filter @ratel/platform db:check
      - name: Test ee
        run: pnpm --filter @ratel/ee test
      - name: Test the MCP Apps views
        run: pnpm --filter @ratel/mcp-apps test
      - name: Test platform-owned scripts
        run: >
          node --test
          scripts/check-layers.test.mjs
          scripts/link-ee.test.mjs
          scripts/quick-start.test.mjs
          scripts/install.test.mjs
          scripts/deploy.test.mjs
          scripts/deploy-buttons.test.mjs
      - name: Shellcheck install.sh
        run: shellcheck -s sh install.sh

  # @ratel/platform tests (PGlite), sharded like private platform-tests. A WASM crash
  # then hits one shard. Shard names stay off the ruleset; ci-gate needs this job id.
  platform-test:
    name: platform-test (${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.platform == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --filter @ratel/platform... --filter @ratel/ee...
      - name: Test
        env:
          TEST_SHARD: ${{ matrix.shard }}/6
        run: pnpm --filter @ratel/platform test

  # The cloud deployer: deploy.sh and the modules under deploy/terraform, checked with both
  # engines (format, init, validate). It logs in to no cloud: nothing is planned or created.
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck deploy.sh
        run: shellcheck -s sh deploy.sh deploy/terraform/check.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: Terraform fmt and validate
        run: deploy/terraform/check.sh terraform
      - name: OpenTofu fmt and validate
        run: deploy/terraform/check.sh tofu
      # GCP Infrastructure Manager runs Terraform 1.5.7 at no cost: the modules must stay valid there.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Terraform 1.5.7 validate
        run: deploy/terraform/check.sh terraform
      # The one-click templates: CloudFormation with cfn-lint, ARM decompiled to Bicep and built,
      # which fails on an invalid template or a wrong property type.
      - name: cfn-lint
        run: pipx run cfn-lint deploy/cloudformation/ratel.yaml
      # Through `az bicep`: the CLI installs bicep where it wants, not always ~/.azure/bin.
      - name: ARM template
        run: |
          az bicep install
          mkdir -p "$RUNNER_TEMP/arm"
          cp deploy/azure/azuredeploy.json "$RUNNER_TEMP/arm/main.json"
          az bicep decompile --file "$RUNNER_TEMP/arm/main.json" --force
          az bicep build --file "$RUNNER_TEMP/arm/main.bicep" --stdout > /dev/null

  # The OSS edition as an operator runs it: built from source (the override), it starts
  # Postgres, migrates on boot and serves; web only queues jobs and the worker runs them.
  platform-compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        # web, worker and demo in one build: the demo image, with the whole source tree, takes 45 s
        # to export, and here that overlaps the Next build.
        run: |
          docker compose --profile demo build
          docker compose up --detach --wait --wait-timeout 180
      - name: Scan the image (fixable HIGH and CRITICAL in app dependencies)
        # Same build as above, no second one. Operating-system packages are listed but do not
        # gate: the base tag moves under us and a Debian fix lands before the Node image does.
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" \
              "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL \
              --ignorefile /src/.trivyignore.yaml "$@" ratel-web
          }
          scan --exit-code 0
          scan --pkg-types library --ignore-unfixed --exit-code 1
      - name: Health, console and migrated schema
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/
          tables=$(docker compose exec -T db psql -U ratel -d ratel -Atc \
            "select count(*) from information_schema.tables where table_schema = 'public'")
          test "$tables" -gt 0
      - name: Quick start from .env.example
        run: |
          docker compose down --volumes
          cp .env.example .env
          sed -i \
            -e 's/^RATEL_ORG_NAME=.*/RATEL_ORG_NAME=CI \& Co/' \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 32)/" \
            -e "s/^TRACE_SIGNALS_HASH_SALT=.*/TRACE_SIGNALS_HASH_SALT=$(openssl rand -hex 32)/" \
            .env
          docker compose up --detach --wait --wait-timeout 120
          # Read the whole page before matching: the console streams, and grep --quiet stops
          # reading at the first match, which fails curl's next write under pipefail.
          grep --quiet 'CI &amp; Co' <<<"$(curl --fail --silent --show-error --location http://127.0.0.1:3000/)"
          # The operator and the organization are constants: a visit writes no identity row, and
          # the open-source schema has no identity table. The first visit seeds the sample
          # project (one project, one seed mark), and only once: a restart and a second visit
          # add nothing.
          counts() {
            docker compose exec -T db psql -U ratel -d ratel -Atc \
              "select (select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('organizations', 'users', 'memberships')), (select count(*) from projects), (select count(*) from sample_project_seeds)"
          }
          test "$(counts)" = "0|1|1"
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --silent --show-error --location --output /dev/null http://127.0.0.1:3000/
          test "$(counts)" = "0|1|1"
      - name: Demo data
        run: |
          docker compose --profile demo run --rm demo
          turns=$(docker compose exec -T db psql -U ratel -d ratel -Atc \
            "select count(*) from trace_turns t join projects p on p.id = t.project_id where p.is_demo and t.status = 'closed'")
          test "$turns" -gt 0
      - name: Jobs ran only in the worker
        # Logs are read whole first: a grep that stops early would end `docker compose logs` on a
        # closed pipe, and pipefail fails the step.
        run: |
          web_logs=$(docker compose logs --no-log-prefix web)
          worker_logs=$(docker compose logs --no-log-prefix worker)
          web=$(grep -c '"msg":"job_finished"' <<<"$web_logs" || true)
          worker=$(grep -c '"msg":"job_finished"' <<<"$worker_logs" || true)
          echo "job_finished: web $web, worker $worker"
          test "$web" -eq 0
          test "$worker" -gt 0
          grep --quiet 'the worker never migrates' <<<"$worker_logs"
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose --profile demo down --volumes

  # gitleaks on the commits a PR or push adds (not the whole history each time). Triaged
  # false positives live in .gitleaksignore, each with a comment. workflow_dispatch and a
  # new-branch push scan everything.
  secret-scan:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          range="--all"
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "${{ github.event_name }}" = push ] && [ "${PUSH_BEFORE//0/}" != "" ]; then
            range="$PUSH_BEFORE..$GITHUB_SHA"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.0 git /repo --redact --verbose --log-opts="$range"

  # THE single required status check for the `main` ruleset (scripts/setup-branch-ruleset.sh).
  # `if: always()` (plus the non-draft guard) makes it run regardless of upstream results —
  # including skips — so the ruleset always gets a definitive Success/Failure instead of
  # waiting on per-leg contexts a skipped matrix job never emits. Skipped and successful
  # upstream jobs both pass; only a real failure or cancellation fails the gate.
  #
  # Do NOT register the per-leg checks (platform-build, `platform-test (…)`) as
  # required directly: a skipped matrix job collapses to one check under the bare job name
  # and never emits its per-leg contexts, leaving them "Expected" forever and blocking merge.
  # When you add a new pre-merge job, ADD IT TO `needs` HERE — otherwise its failure won't
  # block the merge.
  ci-gate:
    name: ci-gate
    needs: [changes, design-system, platform-build, platform-test, platform-compose, deploy, dependency-scan, secret-scan]
    if: >-
      always() &&
      (github.event_name != 'push' || !cancelled()) &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Summarize upstream results
        run: |
          echo "changes=${{ needs.changes.result }} design-system=${{ needs.design-system.result }} platform-build=${{ needs.platform-build.result }} platform-test=${{ needs.platform-test.result }} platform-compose=${{ needs.platform-compose.result }} deploy=${{ needs.deploy.result }} dependency-scan=${{ needs.dependency-scan.result }} secret-scan=${{ needs.secret-scan.result }}"
      - name: Fail if any required job failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required CI job failed or was cancelled"
          exit 1
