# Weekly version updates, grouped to keep noise low. Majors are left to people: the
# `ignore` rules apply to version updates only, so security updates still arrive for every
# ecosystem (they need "Dependabot security updates" on in the repository settings).
# The platform is not a published package (RELEASING.md), so a dependency bump never touches a
# package version and there is no changeset to add.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/src"
      - "/packages/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Base images: the platform Dockerfile and docker-compose.yml. The Node major follows the runtime (24).
  - package-ecosystem: docker
    directories:
      - "/"
      - "/src"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
